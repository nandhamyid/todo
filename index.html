<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Today</h1>
      <p id="summary" class="summary" aria-live="polite"></p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="new-task" class="visually-hidden">New task</label>
      <input id="new-task" type="text" placeholder="What needs doing?" maxlength="200" required />
      <button type="submit">Add task</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </nav>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="app-footer">
      <button type="button" id="clear-done" class="link-button">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
